<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" width="500" height="700" fill="none">
  <defs>
    <!-- Background subtle radial glow (transparent container) -->
    <radialGradient id="bgGlow" cx="250" cy="280" r="260" fx="250" fy="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF8E7" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#FFFDF8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <!-- Sunbeam / Ray Gradient -->
    <linearGradient id="sunbeamGrad" x1="250" y1="50" x2="250" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F7BE38" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#E29E20" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F3C658" stop-opacity="0"/>
    </linearGradient>

    <!-- Glowing Heart Inner Radial Gradient -->
    <radialGradient id="heartGlow" cx="250" cy="255" r="90" fx="250" fy="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="25%" stop-color="#FFF4CE" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#F8C146" stop-opacity="0.8"/>
      <stop offset="85%" stop-color="#DC8D18" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#C27308" stop-opacity="0.1"/>
    </radialGradient>

    <!-- Golden Heart Ribbon Gradient -->
    <linearGradient id="goldHeartGrad" x1="160" y1="180" x2="340" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FEE08B"/>
      <stop offset="45%" stop-color="#E5A124"/>
      <stop offset="100%" stop-color="#B87309"/>
    </linearGradient>

    <!-- Royal Navy Wing Gradient -->
    <linearGradient id="navyWingGrad" x1="120" y1="200" x2="380" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1D3E7F"/>
      <stop offset="50%" stop-color="#0E2554"/>
      <stop offset="100%" stop-color="#071738"/>
    </linearGradient>

    <!-- Inner Gold Wing Accent Ribbon -->
    <linearGradient id="innerGoldGrad" x1="100" y1="280" x2="400" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FEDD85"/>
      <stop offset="50%" stop-color="#DF9C22"/>
      <stop offset="100%" stop-color="#B77209"/>
    </linearGradient>
  </defs>

  <!-- Background Soft Aura -->
  <circle cx="250" cy="270" r="230" fill="url(#bgGlow)" />

  <!-- 1. SUNBEAMS / LIGHT BURST -->
  <g stroke="url(#sunbeamGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.9">
    <line x1="250" y1="40" x2="250" y2="150" />
    <line x1="228" y1="46" x2="238" y2="155" />
    <line x1="206" y1="58" x2="228" y2="162" />
    <line x1="186" y1="74" x2="216" y2="173" />
    <line x1="168" y1="94" x2="206" y2="186" />
    <line x1="152" y1="118" x2="197" y2="201" />
    <line x1="138" y1="146" x2="190" y2="219" />
    <line x1="128" y1="178" x2="185" y2="238" />

    <line x1="272" y1="46" x2="262" y2="155" />
    <line x1="294" y1="58" x2="272" y2="162" />
    <line x1="314" y1="74" x2="284" y2="173" />
    <line x1="332" y1="94" x2="294" y2="186" />
    <line x1="348" y1="118" x2="303" y2="201" />
    <line x1="362" y1="146" x2="310" y2="219" />
    <line x1="372" y1="178" x2="315" y2="238" />
  </g>

  <!-- 2. APEX GOLDEN DIAMOND STAR -->
  <polygon points="250,140 257,156 250,172 243,156" fill="url(#goldHeartGrad)" stroke="#FFFFFF" stroke-width="0.75" />

  <!-- 3. RADIANT HEART CENTER -->
  <path d="M250 185 C272 150 330 152 330 210 C330 258 278 308 250 338 C222 308 170 258 170 210 C170 152 228 150 250 185 Z" fill="url(#heartGlow)" />
  
  <!-- Glowing Center Sparkle -->
  <circle cx="250" cy="235" r="26" fill="#FFFFFF" opacity="0.9" />

  <!-- Golden Heart Outline Ribbon -->
  <path d="M250 185 C272 150 330 152 330 210 C330 258 278 308 250 338 C222 308 170 258 170 210 C170 152 228 150 250 185 Z" stroke="url(#goldHeartGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- 4. OPEN BOOK / WING LAYERS (NAVY & GOLD) -->
  <!-- Top Outer Navy Feathers -->
  <path d="M125 180 C142 230 178 290 250 348 C192 304 144 242 125 180 Z" fill="url(#navyWingGrad)" />
  <path d="M375 180 C358 230 322 290 250 348 C308 304 356 242 375 180 Z" fill="url(#navyWingGrad)" />

  <!-- Middle Navy Layer -->
  <path d="M102 216 C122 268 166 330 250 370 C186 326 132 272 102 216 Z" fill="url(#navyWingGrad)" />
  <path d="M398 216 C378 268 334 330 250 370 C314 326 368 272 398 216 Z" fill="url(#navyWingGrad)" />

  <!-- Inner Gold Ribbon Wing Layer -->
  <path d="M100 250 C130 295 182 355 250 390 C194 348 142 298 100 250 Z" fill="url(#innerGoldGrad)" />
  <path d="M400 250 C370 295 318 355 250 390 C306 348 358 298 400 250 Z" fill="url(#innerGoldGrad)" />

  <!-- Bottom Sweeping Navy Book Spine -->
  <path d="M104 268 C150 326 202 384 250 408 C298 384 350 326 396 268 C354 340 294 402 250 422 C206 402 146 340 104 268 Z" fill="url(#navyWingGrad)" />

  <!-- Bottom Spine Accent Gem -->
  <polygon points="250,406 254,420 250,432 246,420" fill="url(#innerGoldGrad)" />

  <!-- 5. "SCHOOLSOUL" MAIN TYPOGRAPHY -->
  <text x="250" y="525" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="44" letter-spacing="8" fill="#0C254B">SCHOOLSOUL</text>

  <!-- 6. GOLDEN SUB-DIVIDER FLOURISH WITH DIAMOND -->
  <line x1="110" y1="570" x2="235" y2="570" stroke="url(#innerGoldGrad)" stroke-width="1.5" stroke-linecap="round" />
  <polygon points="250,564 256,570 250,576 244,570" fill="#DF9C22" />
  <circle cx="250" cy="584" r="2.5" fill="#DF9C22" />
  <line x1="265" y1="570" x2="390" y2="570" stroke="url(#innerGoldGrad)" stroke-width="1.5" stroke-linecap="round" />
</svg>
